[package]
name = "evo75-keylab"
version = "0.2.2"
edition = "2024"
default-run = "evo75-keylab"
license = "MIT"
description = "Atelier d’éclairage et diagnostic HID pour l’Evo75 sous Windows"

[build-dependencies]
tauri-build = "2"

[dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
open = "5"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["custom-protocol"] }
