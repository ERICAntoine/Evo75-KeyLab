name: Publier KeyLab v0.2.3
on:
  push:
    branches: [publication/v0.2.3]
permissions:
  contents: write
  actions: read
jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ERICAntoine/Evo75-KeyLab
    steps:
      - name: Publier les fichiers Windows validés
        shell: bash
        run: |
          set -euo pipefail
          sha=89a70d0d2471d7326de0025bd2f3ba2b7fca1ee5
          run=45063222170
          test "$(gh run view "$run" --json headSha --jq .headSha)" = "$sha"
          test "$(gh run view "$run" --json conclusion --jq .conclusion)" = success
          gh run download "$run" -n evo75-keylab-windows-x64 -D dist
          gh run download "$run" -n apercu-keylab -D dist
          cd dist
          sha256sum evo75-keylab.exe > SHA256SUMS.txt
          cat > "$RUNNER_TEMP/release.md" <<'NOTES'
          ## Ouvrir KeyLab
          
          Téléchargez **evo75-keylab.exe** ci-dessous et double-cliquez dessus sous Windows x64. La fenêtre utilise Microsoft Edge WebView2. Le fichier **keylab.png** montre l’interface.
          
          ## Dans cette version
          
          Cette version vérifie les tailles et identifiants des rapports HID déclarés par le récepteur avant de tester VIA. Le transport Windows utilise HIDAPI C. Si les transferts échouent, le message précise les formats déclarés par le périphérique. La compatibilité matérielle reste à confirmer sur le récepteur.
          
          Dans **Éclairage → Sur le clavier**, utilisez **Tester VIA** avec le récepteur Evo75 branché. Le test lit la version VIA puis la teinte et la saturation du canal RGB Matrix standard. Une fois la lecture réussie, **Envoyer la teinte des touches** transmet la couleur sélectionnée pour les touches et vérifie sa relecture. Un effet fixe permet de voir le changement.
          
          La compatibilité physique dépend du firmware du récepteur. Le bandeau, les effets et la luminosité des profils restent en aperçu local.
          
          [Compilation et tests Windows](https://github.com/ERICAntoine/Evo75-KeyLab/actions/runs/45063222170)
          NOTES
          gh release create v0.2.3 --target "$sha" --title "Evo75 KeyLab v0.2.3" --notes-file "$RUNNER_TEMP/release.md" evo75-keylab.exe keylab.png SHA256SUMS.txt
